<svg class="bs-scene bs-b" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" aria-hidden="true" focusable="false"><style>
.bs-scene{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
.bs-scene .bs-pos{transform-box:view-box}
.bs-scene .bs-o{stroke:var(--bs-line,#1A1A2E);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.bs-scene .bs-ln{fill:none;stroke:var(--bs-line,#1A1A2E);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bs-scene .bs-soft{opacity:.45}
.bs-scene .bs-k{fill:var(--bs-line,#1A1A2E)}
.bs-scene .bs-hen{fill:var(--bs-hen,#FFFFFF)}
.bs-scene .bs-red{fill:var(--bs-red,#EE3B3B)}
.bs-scene .bs-beak{fill:var(--bs-beak,#FFB21E)}
.bs-scene .bs-chick{fill:var(--bs-chick,#FFE14D)}
.bs-scene .bs-leg{fill:none;stroke:var(--bs-beak,#F59E0B);stroke-width:2;stroke-linecap:round}
.bs-scene .bs-blush{fill:var(--bs-blush,#FF8FA3);opacity:.75}
.bs-scene .bs-shut{display:none}
.bs-scene .bs-sunc{fill:var(--bs-sun,#FFD93B)}
.bs-scene .bs-ray{fill:none;stroke:var(--bs-sun-ray,#FFB400);stroke-width:4;stroke-linecap:round}
.bs-scene .bs-moon,.bs-scene .bs-stars{display:none}
.bs-scene .bs-moonc{fill:var(--bs-moon,#FFF3C4)}
.bs-scene .bs-star{fill:var(--bs-star,#FFF3C4)}
.bs-scene .bs-far{fill:var(--bs-far,#BFE6A6)}
.bs-scene .bs-mid{fill:var(--bs-mid,#8FD06A)}
.bs-scene .bs-field{fill:var(--bs-field,#A9DD7F)}
.bs-scene .bs-edge{fill:none;stroke:var(--bs-line,#1A1A2E);stroke-width:2;stroke-linejoin:round}
.bs-scene .bs-edge2{fill:none;stroke:var(--bs-edge2,#5BA845);stroke-width:1.6}
.bs-scene .bs-tree{fill:var(--bs-tree,#48B04F)}
.bs-scene .bs-tree2{fill:var(--bs-tree2,#2F9A4A)}
.bs-scene .bs-trunk{fill:var(--bs-trunk,#A0652E)}
.bs-scene .bs-flw{fill:var(--bs-flw,#FFFFFF);stroke:var(--bs-line,#1A1A2E);stroke-width:1}
.bs-scene .bs-cloud{fill:var(--bs-cloud,#FFFFFF);stroke:var(--bs-line,#1A1A2E);stroke-width:1.8;opacity:.9}
/* anchors (percentages are of the whole banner, thanks to transform-box:view-box) */
.bs-scene .bs-bl{transform:translate(0,100%)}
.bs-scene .bs-br{transform:translate(100%,100%)}
.bs-scene .bs-tl{transform:translate(0,0)}
.bs-scene .bs-tr{transform:translate(100%,0)}
.bs-scene .bs-board{fill:var(--bs-board,#FFF8E1)}
.bs-scene .bs-name{font:800 16px/1 'Comic Sans MS','Chalkboard SE','Comic Neue','Trebuchet MS',Arial,sans-serif;paint-order:stroke;stroke:var(--bs-line,#1A1A2E);stroke-width:.7;letter-spacing:.6px}
.bs-scene .bs-stop{stop-color:var(--bs-line,#1A1A2E)}
.bs-scene .bs-brown{fill:var(--bs-brown,#C7672F)}
.bs-scene .bs-browndk{fill:var(--bs-browndk,#6B2C12)}
.bs-scene .bs-gold{fill:var(--bs-gold,#E08A3C)}
.bs-scene .bs-grey{fill:var(--bs-grey,#AEB5BE)}
.bs-scene .bs-bars{fill:none;stroke:var(--bs-bars,#3F4752);stroke-width:1.5;stroke-linecap:round}
.bs-scene .bs-hackle{fill:none;stroke:var(--bs-line,#1A1A2E);stroke-width:1.4;stroke-linecap:round}
.bs-scene .bs-wood{fill:var(--bs-wood,#EBC88E)}
.bs-scene .bs-door{fill:var(--bs-door,#6B4A2C)}
.bs-scene .bs-roof{fill:var(--bs-roof,#3E8E4F)}
.bs-scene .bs-o1{stroke:var(--bs-line,#1A1A2E);stroke-width:1.2;stroke-linejoin:round}
.bs-scene .bs-legk{fill:none;stroke:var(--bs-line,#1A1A2E);stroke-width:5.6;stroke-linecap:round;stroke-linejoin:round}
.bs-scene .bs-jacket{fill:var(--bs-jacket,#D7263D)}
.bs-scene .bs-arm{fill:none;stroke:var(--bs-jacket,#D7263D);stroke-width:4.4;stroke-linecap:round}
.bs-scene .bs-skin{fill:var(--bs-skin,#D9A27A)}
.bs-scene .bs-curl{fill:none;stroke:var(--bs-line,#1A1A2E);stroke-width:2.4;stroke-linecap:round}
.bs-scene .bs-band{fill:none;stroke:var(--bs-hen,#FFFFFF);stroke-width:1.4}
.bs-scene .bs-spark{fill:var(--bs-sun,#FFD93B);stroke:var(--bs-line,#1A1A2E);stroke-width:.4}
.bs-scene .bs-rab{fill:var(--bs-rab,#C9793A)}
.bs-scene .bs-rabdk{fill:var(--bs-rabdk,#5A4740)}
.bs-scene .bs-mob{display:none}
@media (max-width:720px){
 .bs-scene .bs-desk{display:none}
 .bs-scene .bs-mob{display:inline}
 .bs-scene .bs-mtop{transform:translate(50%,0)}
}
