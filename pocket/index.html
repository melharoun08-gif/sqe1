<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Layla's Pocket Revision</title>
<meta name="theme-color" content="#7EC8F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket SQE1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="icon" href="img/icon-192.png">
<style>
:root{--ink:#1d1d1f;--mut:#5d5d66;--sky1:#8FD3F7;--sky2:#D9F1FF;--grass:#7CC56B;--grass2:#5BAE4C;--paper:#FFFDF7;--good:#2E9D4A;--bad:#D6453F;--gold:#FFC83D;
  --a:#A3215B;--p:#FFF0F7;--l:#F3A5CA;--c1:#E63946;--c2:#FFC300;--c3:#2EC4B6;
  --font:'Calibri','Carlito','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:18px/1.4 var(--font);color:var(--ink);background:#CDEBFA;overscroll-behavior:none}
@media (min-width:600px){
  body{background:radial-gradient(circle at 20% 10%,#FFF6C8 0 60px,transparent 61px),linear-gradient(#9AD8F8,#DDF3FF 60%,#8FCF7C 60%,#79BD67)}
  #app{margin:24px auto;height:calc(100% - 48px);max-height:900px;border-radius:34px;border:10px solid #222;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .deskhint{display:block!important}
}
#app{position:relative;max-width:430px;height:100%;margin:0 auto;overflow:hidden;background:var(--sky2);display:flex;flex-direction:column}
.deskhint{display:none;position:fixed;left:16px;bottom:16px;max-width:240px;font-size:14px;color:#25502a;background:rgba(255,255,255,.8);border-radius:12px;padding:8px 12px}
/* top bar */
.bar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;z-index:3}
@media (display-mode:standalone){.bar{padding-top:calc(16px + max(env(safe-area-inset-top), 50px))}}
.bar .ttl{flex:1;font-weight:700;font-size:17px;line-height:1.15;color:#123}
.bar .ttl small{display:block;font-weight:400;font-size:14px;color:#345}
.bag{display:flex;align-items:center;gap:4px;font-weight:700;font-size:18px;background:#fff;border:2.5px solid #111;border-radius:22px;padding:2px 10px 2px 4px;box-shadow:0 2px 0 #111}
.bag svg{width:30px;height:30px}
.testb{font-weight:700;font-size:13px;background:#E63946;color:#fff;border:2px solid #111;border-radius:8px;padding:1px 6px}
.back{border:0;background:#fff;border:2.5px solid #111;border-radius:50%;width:38px;height:38px;font:700 22px/1 var(--font);box-shadow:0 2px 0 #111;cursor:pointer;flex:0 0 auto}
/* scroll body */
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 24px;margin-bottom:calc(204px + env(safe-area-inset-bottom));position:relative;z-index:2}
/* sky, weather, time of day (Monnie 21 Nov 03:23) */
#sky{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(var(--sky1),var(--sky2) 75%);transition:background 2s}
#sky svg{position:absolute;overflow:visible}
#sky .sun{right:18px;bottom:calc(104px + env(safe-area-inset-bottom));width:64px;height:64px;animation:spin 40s linear infinite}
#sky .moon{right:22px;bottom:calc(108px + env(safe-area-inset-bottom));width:52px;height:52px}
@media (max-height:780px){#sky .sun{bottom:calc(92px + env(safe-area-inset-bottom));width:56px;height:56px}#sky .moon{bottom:calc(96px + env(safe-area-inset-bottom));width:46px;height:46px}.donebub{bottom:calc(178px + env(safe-area-inset-bottom))!important}}
@media (max-height:700px){#sky .sun{bottom:calc(76px + env(safe-area-inset-bottom));width:50px;height:50px}#sky .moon{bottom:calc(80px + env(safe-area-inset-bottom));width:42px;height:42px}.donebub{bottom:calc(156px + env(safe-area-inset-bottom))!important}}
#sky .cloud{width:120px;height:60px;left:-140px;animation:drift linear infinite}
#sky .bird{width:34px;height:20px;left:-50px;animation:fly linear forwards}
#sky .bird path{animation:flapw .35s ease-in-out infinite alternate;transform-origin:50% 60%}
#sky .rainbow{left:-10%;width:120%;height:260px;bottom:120px;opacity:0;animation:rbin 3s ease-out forwards}
#sky .star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;animation:twinkle 2.4s ease-in-out infinite alternate}
#sky .drop{position:absolute;top:-20px;width:2px;height:14px;background:rgba(80,120,180,.55);border-radius:2px;animation:rain linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{to{transform:translateX(calc(430px + 300px))}}
@keyframes fly{to{transform:translateX(560px) translateY(var(--dy,0px))}}
@keyframes flapw{from{transform:scaleY(1)}to{transform:scaleY(-.5)}}
@keyframes rbin{to{opacity:.55}}
@keyframes twinkle{from{opacity:.2}to{opacity:1}}
@keyframes rain{to{transform:translateY(110vh)}}
#app.night{--sky1:#0E1A3A;--sky2:#2A3A6E}
#app.night .bar .ttl,#app.night .bar .ttl small,#app.night .sect,#app.night .tmeta,#app.night .tmeta button,#app.night .pick{color:#fff}
#app.dusk{--sky1:#F59E6B;--sky2:#FFD9A8}
#app.dawn{--sky1:#F7A8C4;--sky2:#FFE7C2}
#app.rainy{--sky1:#8FA3B8;--sky2:#D3DDE6}
#app.night .ground{--grass:#3E7A3A;--grass2:#2F612C}
.ground{position:absolute;left:0;right:0;bottom:0;height:calc(58px + env(safe-area-inset-bottom));background:linear-gradient(var(--grass),var(--grass2));border-top:3px solid #3E8A33;z-index:1}
.ground:before{content:"";position:absolute;left:0;right:0;top:-12px;height:12px;background:radial-gradient(circle at 8px 12px,var(--grass) 8px,transparent 9px) 0 0/22px 12px repeat-x}
/* Layla (approved drawings only) and the website's Britney stand on the grass */
.lay{position:absolute;left:12px;bottom:calc(14px + env(safe-area-inset-bottom));height:184px;z-index:2;pointer-events:none;transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite}
.lay img{height:100%;display:block}
.lay.jump{animation:jump .5s ease-out 2}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.015)}}
@keyframes jump{50%{transform:translateY(-16px)}}
.bri2{position:absolute;left:96px;bottom:calc(12px + env(safe-area-inset-bottom));width:128px;z-index:3}
.bri2 .bflip{display:block;transform:scaleX(-1)}
.bri2.peck img{animation:peck .5s ease-in-out 2}
@keyframes peck{50%{transform:rotate(16deg) translateY(6px)}}
.bri2 img{width:100%;display:block;transform-origin:50% 100%;animation:rock 2.8s ease-in-out infinite;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.bri2.on img{animation:hop .45s ease-out 2}
@keyframes rock{0%,100%{transform:rotate(0)}30%{transform:rotate(-4deg)}60%{transform:rotate(2deg) translateY(-2px)}}
@keyframes hop{50%{transform:translateY(-20px) rotate(-6deg)}}
#app.herohere .bri2{display:none}
/* website-style bubbles: white, black felt-tip line, real triangle tail at the speaker */
.sb{background:#fff;border:2.5px solid #1d1d1b;border-radius:18px;padding:9px 14px;font-weight:700;font-size:17px;line-height:1.2;color:#1d1d1b;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.sb>i.td{position:absolute;top:100%;left:26px;margin-top:-3px;width:18px;height:16px}
.sb>i.tl{position:absolute;left:-19px;bottom:18px;width:20px;height:18px;margin-left:2px}
.sb>i svg{display:block;width:100%;height:100%;overflow:visible}
.bri2 .pb{display:none;position:absolute;left:30px;bottom:calc(100% + 14px);width:max-content;max-width:170px}
.lb{display:none;position:absolute;left:calc(12px + var(--lw,64px) + 10px);bottom:calc(132px + env(safe-area-inset-bottom));width:max-content;max-width:190px;z-index:4}
.lb.on{display:block;animation:fadeup .25s both}
@media (max-height:780px){.lb{bottom:calc(112px + env(safe-area-inset-bottom))}}
@media (max-height:700px){.lb{bottom:calc(92px + env(safe-area-inset-bottom))}}
.bri2 .pb.on{display:block;animation:fadeup .25s both}
.bri2 .pb.think{font-weight:400;font-style:normal;border-radius:26px}
.bri2 .pb.think>i.td{display:none}
.bri2 .pb.think:before,.bri2 .pb.think:after{content:"";position:absolute;background:#fff;border:2.5px solid #1d1d1b;border-radius:50%}
.bri2 .pb.think:before{left:22px;bottom:-15px;width:12px;height:12px}
.bri2 .pb.think:after{left:14px;bottom:-26px;width:7px;height:7px}
/* Britney + speech bubble */
.hero{position:relative;display:flex;align-items:flex-end;gap:6px;margin:6px 0 10px;min-height:150px}
.hero .bri{width:150px;flex:0 0 auto;transform-origin:50% 100%;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both,rock 2.8s ease-in-out .6s infinite}
.hero .bri img{width:100%;display:block;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.say{position:relative;flex:1;font-size:21px;padding:12px 14px;margin:0 0 60px 14px;animation:fadeup .45s .25s both}
@keyframes pop{0%{transform:scale(.2) translateY(60px);opacity:0}100%{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-6px) rotate(-3deg)}50%{transform:translateY(0) rotate(0)}70%{transform:translateY(-3px) rotate(2deg)}}
@keyframes fadeup{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
/* big buttons */
.times{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.times .tbtn{flex:0 0 calc((100% - 24px) / 3)}
.tbtn{font:700 20px/1.1 var(--font);background:#fff;border:3px solid #111;border-radius:20px;padding:16px 4px 12px;box-shadow:0 4px 0 #111;cursor:pointer;color:var(--ink);animation:fadeup .4s both}
.tbtn b{display:block;font-size:34px;line-height:1}
.tbtn:active,.choice:active,.opt:active,.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #111}
.tbtn:nth-child(1){background:#FFE3EF}.tbtn:nth-child(2){background:#FFF3C4}.tbtn:nth-child(3){background:#DDF5E3}.tbtn:nth-child(4){background:#E2EEFF}.tbtn:nth-child(5){background:#F0E6FF}
.tbtn:nth-child(2){animation-delay:.05s}.tbtn:nth-child(3){animation-delay:.1s}.tbtn:nth-child(4){animation-delay:.15s}.tbtn:nth-child(5){animation-delay:.2s}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:700 22px/1.15 var(--font);background:#fff;border:3px solid #111;border-radius:22px;padding:14px 16px;box-shadow:0 4px 0 #111;margin:0 0 14px;cursor:pointer;color:var(--ink);animation:fadeup .4s both}
.choice small{display:block;font-weight:400;font-size:16px;color:var(--mut);margin-top:3px}
.choice .ic{width:62px;height:62px;flex:0 0 auto}
.choice .ic svg{width:100%;height:100%}
.choice.go{background:#DFF5E4;font-size:30px;padding:18px 16px}
.choice.go small{font-size:16px}
.pick{display:block;margin:6px auto 0;border:0;background:none;font:700 18px var(--font);color:#1d4f91;text-decoration:underline;cursor:pointer;padding:10px}
.choice:nth-child(2){animation-delay:.08s}
.today{font-size:15px;color:#24485c;text-align:center;margin:14px 0 0}
/* topic picker */
.stop{background:#fff;border:3px solid #111;border-radius:18px;margin:0 0 12px;box-shadow:0 3px 0 #111;overflow:hidden}
.stop>button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--p);padding:8px 12px;font:700 18px/1.15 var(--font);text-align:left;cursor:pointer;color:var(--ink)}
.stop>button small{display:block;font-weight:400;font-size:15px;color:var(--mut)}
.stop .pic{width:64px;height:50px;flex:0 0 auto}
.stop .pic svg{width:100%;height:100%}
.stop .chev{margin-left:auto;font-size:22px;transition:transform .2s}
.stop.open .chev{transform:rotate(90deg)}
.tlist{display:none;padding:4px 10px 10px;background:#fff}
.stop.open .tlist{display:block}
.tbt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1.5px dashed #ddd;background:none;padding:11px 4px;font:17px/1.25 var(--font);color:var(--ink);cursor:pointer}
.tbt:last-child{border-bottom:0}
.tbt .n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--a);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
.tbt .tick{margin-left:auto;font-size:13px;color:var(--good);font-weight:700;white-space:nowrap}
.sect{font-weight:700;font-size:16px;color:#24485c;margin:4px 2px 10px}
/* session */
.tbar{height:12px;background:rgba(255,255,255,.75);border:2px solid #111;border-radius:8px;overflow:hidden;margin:0 0 6px}
.tbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3));transition:width 1s linear}
.tmeta{display:flex;justify-content:space-between;font-size:14px;color:#24485c;margin-bottom:10px}
.tmeta button{border:0;background:none;font:700 14px var(--font);color:#24485c;text-decoration:underline;cursor:pointer;padding:0}
.item{animation:slidein .35s both}
@keyframes slidein{0%{opacity:0;transform:translateX(40px)}100%{opacity:1;transform:none}}
.kind{display:inline-block;font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;background:#111;color:#fff;border-radius:10px;padding:2px 9px;margin:0 0 8px}
.ttl2{font-size:15px;color:#24485c;margin:0 0 8px;font-weight:700}
/* the revision card object */
.rcard{position:relative;background:var(--paper);border:3px solid #111;border-radius:16px;box-shadow:0 4px 0 #111;margin:0 0 14px;padding:0 0 14px}
.rcard .ftop{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:2.5px solid #111;background:var(--p);border-radius:13px 13px 0 0}
.rcard .fico{width:30px;height:30px;color:var(--a);flex:0 0 auto}
.rcard .fico svg{width:100%;height:100%}
.rcard .fnm{line-height:1.05}
.rcard .fnm b{display:block;font-size:14px;letter-spacing:.06em;color:var(--a)}
.rcard .fnm span{font-size:12px;letter-spacing:.05em;color:var(--mut)}
.rcard .q{font-size:20px;font-weight:700;line-height:1.3;padding:12px 16px 0}
.rcard .ans{margin:12px 16px 0;padding:10px 12px;border-radius:12px;background:#fff;border:2px dashed var(--l);font-size:18px;animation:fadeup .3s both}
.rcard .reveal{display:block;margin:14px auto 0;font:700 18px var(--font);background:var(--a);color:#fff;border:3px solid #111;border-radius:16px;padding:10px 18px;box-shadow:0 3px 0 #111;cursor:pointer}
/* shapes by stop */
.rcard.sweet{margin:0 30px 14px}
.rcard.sweet .wend{position:absolute;top:50%;width:34px;height:70px;margin-top:-35px;z-index:-1}
.rcard.sweet .wl{left:-31px}.rcard.sweet .wr{right:-31px;transform:scaleX(-1)}
.rcard.ticket{border-radius:10px;background:repeating-linear-gradient(45deg,#FFF6DA 0 14px,#FFEFC0 14px 28px);padding-right:44px}
.rcard.ticket .ftop{background:#E63946;border-radius:7px 0 0 0}
.rcard.ticket .ftop b,.rcard.ticket .ftop span,.rcard.ticket .fico{color:#fff}
.rcard.ticket .stub{position:absolute;top:0;right:0;bottom:0;width:44px;border-left:3px dashed #111;background:#FFC300;border-radius:0 7px 7px 0;display:flex;align-items:center;justify-content:center}
.rcard.ticket .stub span{transform:rotate(90deg);white-space:nowrap;font-weight:700;font-size:13px;letter-spacing:.12em}
.rcard.ticket:before,.rcard.ticket:after{content:"";position:absolute;right:30px;width:26px;height:26px;border-radius:50%;background:var(--sky2);border:3px solid #111;z-index:2}
.rcard.ticket:before{top:-15px}.rcard.ticket:after{bottom:-15px}
.rcard.tag{margin-left:8px;border-radius:12px 12px 12px 40px}
.rcard.tag .hole{position:absolute;left:14px;bottom:14px;width:18px;height:18px;border-radius:50%;border:3px solid #111;background:var(--sky2)}
.rcard .bc{height:22px;margin:12px 16px 0;background:repeating-linear-gradient(90deg,#111 0 2px,transparent 2px 4px,#111 4px 7px,transparent 7px 9px,#111 9px 10px,transparent 10px 13px);opacity:.75;border-radius:2px}
.rcard.lined{background:repeating-linear-gradient(var(--paper) 0 29px,#cfe3f5 29px 31px)}
.rcard.post .stamp{position:absolute;right:10px;top:6px;width:38px;height:44px;border:2.5px dashed #111;background:var(--p);border-radius:3px}
.rcard.post .ftop{padding-right:60px}
/* answers */
.opts{display:grid;gap:10px;margin:0 0 12px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;font:18px/1.3 var(--font);background:#fff;border:3px solid #111;border-radius:16px;padding:12px 14px;box-shadow:0 3px 0 #111;cursor:pointer;color:var(--ink)}
.opt .L{flex:0 0 28px;height:28px;border-radius:50%;border:2.5px solid #111;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;background:#FFF3C4}
.opt.right{background:#DFF5E4;border-color:var(--good)}.opt.right .L{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{background:#FDE7E5;border-color:var(--bad)}.opt.wrong .L{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt[disabled]{cursor:default}
.why{background:#fff;border:3px solid #111;border-radius:16px;padding:10px 14px;margin:0 0 12px;font-size:17px;animation:fadeup .3s both}
.why h4{margin:0 0 4px;font-size:19px}
.btn{display:block;width:100%;font:700 20px var(--font);background:#2B6CD8;color:#fff;border:3px solid #111;border-radius:18px;padding:13px;box-shadow:0 4px 0 #111;cursor:pointer;margin:0 0 12px}
.btn.green{background:var(--good)}.btn.soft{background:#fff;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* coins + cheer */
.coinpop{position:absolute;z-index:20;pointer-events:none;width:44px;height:44px;animation:coinup 1.1s ease-out forwards}
.coinpop svg{width:100%;height:100%}
.coinpop b{position:absolute;left:46px;top:6px;font-size:22px;color:#8a5a00;text-shadow:0 1px 0 #fff}
@keyframes coinup{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-10px) scale(1.1)}100%{transform:translateY(-140px) scale(.9);opacity:0}}
.bag.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
/* end */
.score{background:#fff;border:3px solid #111;border-radius:20px;padding:14px 16px;box-shadow:0 4px 0 #111;margin:0 0 14px;font-size:19px}
.score .big{display:flex;align-items:center;gap:8px;font-size:30px;font-weight:700}
.score .big svg{width:40px;height:40px}
.flapper{width:170px;animation:flap 1.2s ease-in-out infinite;transform-origin:50% 80%}
@keyframes flap{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}
.confetti{position:absolute;top:-20px;width:10px;height:16px;z-index:5;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.choice.go2{background:#FFF8D8}
.choice.fix{background:#FFE9E7}
.choice.tl{position:relative}.choice.tl[disabled]{opacity:.55}
.choice.did{background:#EAF8EC}
.choice .ok{margin-left:auto;width:40px;height:40px;flex:0 0 auto;border-radius:50%;background:var(--good);color:#fff;border:3px solid #111;display:flex;align-items:center;justify-content:center;font-size:24px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.tpage{text-align:center;background:var(--p);border:3px solid #111;border-radius:22px;box-shadow:0 4px 0 #111;padding:12px 14px 14px;margin:6px 0 16px}
.tpic{width:130px;height:100px;margin:0 auto}.tpic svg{width:100%;height:100%}
.tno{font-weight:700;color:var(--a);font-size:15px;letter-spacing:.05em;text-transform:uppercase;margin-top:4px}
.tname{margin:2px 0 0;font-size:26px;line-height:1.15}
.tname.flash{animation:flash 1s ease-out}
@keyframes flash{0%{transform:scale(.6);opacity:0}40%{transform:scale(1.12);opacity:1}100%{transform:none}}
.roll{text-align:center;font-weight:700;font-size:26px;line-height:1.2;min-height:120px;display:flex;align-items:center;justify-content:center;background:#fff;border:3px solid #111;border-radius:22px;box-shadow:0 4px 0 #111;padding:14px}
.roll span{color:var(--a)}
.tick.half{color:#B07A00}
.donebub{position:absolute;left:12px;right:12px;top:calc(64px + env(safe-area-inset-top));bottom:calc(210px + env(safe-area-inset-bottom));justify-content:center;z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border:3px solid #111;border-radius:24px;box-shadow:0 5px 0 #111;padding:12px 18px 16px;text-align:center;font-size:26px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both;transition:opacity .5s}
.donebub img{width:150px;animation:hop .6s ease-out 3}
.donebub.off{opacity:0}

/* ---------- storage (phone only; never touches the laptop save) ---------- */
function ymd(d){ d = d || new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }

  if (won){ confetti(); layPose(5, 1800); LAY.box.classList.remove("jump"); void LAY.box.offsetWidth; LAY.box.classList.add("jump"); var say = document.createElement("div"); say.className = "donebub"; say.innerHTML = '<img src="img/b-happy.webp" alt=""><b>' + (ty === "q" ? "Well done, Layla! " + r + " out of " + n + " right." : "Well done, Layla! Cards done.") + '</b>';
    app.appendChild(say); say.addEventListener("click", function(){ say.remove(); }); setTimeout(function(){ say.classList.add("off"); }, 2800); setTimeout(function(){ say.remove(); }, 3400); }
}

/* ---------- taps ---------- */
main.addEventListener("click", handle); bar.addEventListener("click", handle);
/* Monnie's test switch: tap the coin bag 5 times quickly. Test mode sends nothing to the progress page (so no coins or progress count for Layla) */
var BAGT = [];
function toggleTest(){ MONNIE = !MONNIE; try { if (MONNIE) localStorage.setItem("sqe_nofeed", "1"); else localStorage.removeItem("sqe_nofeed"); } catch(err){}
  go(VIEWNOW === "sess" || VIEWNOW === "roll" ? "home" : VIEWNOW, VIEWNOW === "topic" ? TOPIC : undefined);
  if (VIEWNOW === "home"){ var sy = main.querySelector(".say"); if (sy) sy.innerHTML = TAILL + (MONNIE ? "Test mode on. Nothing here counts for Layla." : "Test mode off. Everything counts again."); }
  else bub(MONNIE ? "Test mode on. Nothing here counts for Layla." : "Test mode off. Everything counts again.", "say2", 3500); }
/* also: press and hold Britney for 2 seconds */
var HOLD = 0;
app.addEventListener("pointerdown", function(e){ if (!e.target.closest(".bri, .bri2")) return; clearTimeout(HOLD); HOLD = setTimeout(toggleTest, 2000); });
["pointerup", "pointercancel", "pointerleave"].forEach(function(ev){ app.addEventListener(ev, function(){ clearTimeout(HOLD); }); });
app.addEventListener("contextmenu", function(e){ if (e.target.closest(".bri, .bri2")) e.preventDefault(); });
bar.addEventListener("click", function(e){ if (!e.target.closest(".bag")) return; var now = Date.now(); BAGT = BAGT.filter(function(t){ return now - t < 2500; }); BAGT.push(now);
  if (BAGT.length >= 5){ BAGT = []; toggleTest(); } });
function handle(e){
  var b = e.target.closest("button"); if (!b || b.disabled) return;
  if (b.dataset.go){ if (VIEWNOW === "sess" && SESS) return finish(); go(b.dataset.go); }
  else if (b.dataset.stop){ var st = b.parentNode, was = st.classList.contains("open"); [].forEach.call(main.querySelectorAll(".stop.open"), function(x){ x.classList.remove("open"); }); if (!was){ st.classList.add("open"); setTimeout(function(){ main.scrollTo({top:st.offsetTop - 8, behavior:"smooth"}); }, 30); } }
  else if (b.dataset.topic) go("topic", b.dataset.topic);
  else if (b.dataset.o != null) answer(+b.dataset.o);
  else if (b.dataset.do === "fix") startFix();
  else if (b.dataset.do === "random"){ VIEWNOW = "home"; shuffleShow(); }
  else if (b.dataset.do === "cards") start("c");
  else if (b.dataset.do === "qs") start("q");
  else if (b.dataset.do === "show"){ SESS.q[SESS.i].shown = 1; drawItem(); }
  else if (b.dataset.do === "next") next();
  else if (b.dataset.do === "prev"){ if (SESS.i) { SESS.i--; drawItem(); } }
  else if (b.dataset.do === "stop") finish();
}
go("home");
if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(function(){});
window.PK = {P:P, covered:covered, feedSum:feedSum, go:go};
})();
